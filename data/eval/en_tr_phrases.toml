# English -> Turkish translation check, written for this project (MIT).
# Categories:
#   clean  - fluent callouts
#   broken - typical non-native grammar (missing articles/verbs, wrong tense)
#   slang  - gamer abbreviations and slang
#   casual - everyday team talk
# "tr" is a natural Turkish reference translation; game terms stay as players say them.

[[phrases]]
category = "clean"
en = "They're rushing B, five of them."
tr = "B'ye rush atıyorlar, beşi birden."

[[phrases]]
category = "clean"
