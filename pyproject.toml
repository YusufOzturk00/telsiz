[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telsiz"
version = "0.1.0"
description = "Real-time voice chat translator for CS2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "YusufOzturk00" }]
keywords = ["translation", "speech-to-text", "voice-chat", "overlay", "whisper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Speech recognition (faster-whisper, MIT). Also ships the Silero VAD ONNX model.
whisper = ["faster-whisper>=1.1"]
# Argos Translate models run directly on CTranslate2 (MIT) with SentencePiece (Apache-2.0)
# or Moses + BPE tokenization (sacremoses, subword-nmt; both MIT).
# The argostranslate package itself is not used: it depends on minisbd (AGPL-3.0).
argos = [
    "ctranslate2>=4.0,<5",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "subword-nmt>=0.3.8",
]
# NLLB-200 translation on CTranslate2 (MIT); model weights are CC-BY-NC-4.0, downloaded at runtime.
nllb = [
    "ctranslate2>=4.0,<5",
    "tokenizers>=0.15",
    "huggingface-hub>=0.21",
]
# NVIDIA CUDA 12 runtime libraries for GPU inference (optional).
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
# Live system-audio capture through WASAPI loopback (Apache-2.0).
capture = ["PyAudioWPatch>=0.2.12"]
# Local web server for the second screen and phone (MIT / BSD).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "qrcode>=7.4",
]
all = ["telsiz[whisper,argos,nllb,capture,server]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx2>=2",  # Starlette TestClient
]

[project.scripts]
telsiz = "telsiz.__main__:main"

[project.urls]
Homepage = "https://github.com/YusufOzturk00/telsiz"
Issues = "https://github.com/YusufOzturk00/telsiz/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/telsiz"]

[tool.hatch.build.targets.wheel.force-include]
"data/glossary.toml" = "telsiz/data/glossary.toml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: runs real models (Whisper, translation); skipped by default, run with -m slow",
]
