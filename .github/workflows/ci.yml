name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,server]"
      - name: pytest
        run: python -m pytest -m "not slow"
      - name: CLI smoke test
        run: python -m telsiz --help

  native:
    name: Native helper (process loopback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/process_loopback -B native/process_loopback/build -A x64
      - name: Build
        run: cmake --build native/process_loopback/build --config Release
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "native/process_loopback/build/Release/telsiz-loopback.exe"
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notlike "telsiz-loopback *") {
            throw "unexpected --version output: $version"
          }
          & $exe --pid nope 2>$null
          if ($LASTEXITCODE -ne 1) { throw "bad arguments should exit with 1, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: telsiz-loopback
          path: native/process_loopback/build/Release/telsiz-loopback.exe
          if-no-files-found: error
