# Telsiz settings. Copy to config.toml and change what you need;
# anything left out uses the default shown here.

# Language translations are shown in (ISO 639-1 code).
target_lang = "tr"

# Languages your teammates may speak. Detection only picks from this list.
allowed_source_langs = ["en", "ru", "uk", "pl", "de", "tr"]

# When someone already speaks the target language: "show" the original text or "hide" it.
same_language = "show"

[asr]
# Whisper model: "auto" picks large-v3-turbo on an NVIDIA GPU and small on the CPU.
# Or set "small", "medium" or "large-v3-turbo".
model = "auto"
# "auto" uses an NVIDIA GPU when the CUDA libraries are installed, otherwise the CPU.
# Exception: while listening to the game (--live), "auto" means the CPU. During a match
# the game keeps the graphics card so busy that recognition there took ~26 s per
# sentence versus ~3 s on the CPU. Set "cuda" to use the graphics card anyway.
device = "auto"
compute_type = "auto"
beam_size = 5
# When a clip sounds unsure, Whisper can decode it again up to five more times.
# Measured in CS2 matches: ~27 % of clips were retried and took ~4.7 s instead of
# ~2.2 s, without better text. Off by default; true turns the retries back on.
temperature_fallback = false

# Extra vocabulary per language that helps Whisper hear game terms.
# English already has a built-in list of CS2 callouts; set en = "" to turn it off.
# [asr.prompts]
# ru = "Раш Б, флешка, смок, дефуза"

[language]
# Below this confidence, or for utterances shorter than min_duration_s,
# the language that dominated the last sticky_window_s seconds is used.
min_confidence = 0.6
min_duration_s = 1.2
sticky_window_s = 30.0

[vad]
threshold = 0.5
min_silence_ms = 500
speech_pad_ms = 200
min_speech_ms = 250
max_utterance_s = 6.0

[filter]
# Drops typical Whisper output on silence ("Thank you.", subtitle credits, loops).
no_speech_threshold = 0.6
log_prob_threshold = -1.0
compression_ratio_threshold = 2.4
max_ngram_repeats = 5

[glossary]
# Game terms stay as players say them ("AWP", "eco", "A long"), abbreviations are
# expanded ("nt" -> "nice try") and idioms get fixed translations before translating.
enabled = true
# Leave empty for the built-in data/glossary.toml, or point to your own file.
path = ""

[performance]
# Telsiz's own process priority: "normal" (default), "below_normal" or "idle". Lower
# priorities let a game that keeps every core busy (CS2 without an FPS cap) starve
# recognition, even on the graphics card: subtitles then only appear after alt-tab.
# The game is protected by the thread limit instead: at most this many CPU threads
# (0 = all) for recognition and translation.
priority = "normal"
cpu_threads = 4
# Live mode: if processing falls more than this many seconds behind (busy graphics card,
# slow recognition), skip the backlog so subtitles stay current. 0 = never skip.
max_lag_s = 5.0

[capture]
# "auto" (default): listen to the game only, so music, videos and Discord on this PC are
# not translated. This uses Windows process loopback (Windows 10 2004 or newer) through
# telsiz-loopback.exe; if that is not possible, Telsiz falls back to all PC audio and says
# so. "system": always listen to all audio this PC plays.
mode = "auto"
# The program to listen to. Its child processes are included.
process_name = "cs2.exe"
# Leave empty to find telsiz-loopback.exe automatically.
helper_path = ""

[server]
# Local web page for a second screen or phone: http://127.0.0.1:<port>/
port = 8765
# Open the page in the browser when "python -m telsiz --live" starts.
open_browser = true

[translate]
# "auto" (default) picks by installed RAM: 22 GB or more -> NLLB-1.3B, 11 GB or more ->
# NLLB-600M, less -> Argos. Or set "nllb" or "argos" yourself. Everything runs on this PC.
# NLLB translates Russian/Ukrainian straight to Turkish (no English step) but its
# model weights are licensed CC-BY-NC-4.0: non-commercial use only.
engine = "auto"
device = "cpu"
# Used when engine = "nllb": "nllb-600m" (~650 MB) or "nllb-1.3b" (~1.4 GB, more accurate).
nllb_model = "nllb-600m"
